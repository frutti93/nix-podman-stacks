---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE ($NUMBERS) $AUTHORS"
change-title-escapes: '\<*_&'

categories:
  - title: "🚀 Features"
    semver-increment: "minor"
    when:
      conventional:
        type: "feat"
  - title: "🐛 Bug Fixes"
    when:
      conventional:
        type: "fix"
  - title: "🔧 Refactoring"
    when:
      conventional:
        types: ["refactor", "perf"]
  - title: "📚 Documentation"
    when:
      conventional:
        type: "docs"
  - title: "⬆️ Dependency Updates"
    when:
      conventional:
        type: "chore"
        scope: "deps"
  - type: "version-resolver"
    semver-increment: "major"
    when:
      conventional:
        breaking: true
  - title: "🧰 Other Changes"

group-changes:
  - pattern: '/^chore\(deps\): update (?:action |dependency |module )?(?<group>.+?)(?: docker tag)? to (?<to>\S+)$/'
    title-template: "Update $GROUP to $LAST_TO"

replacers:
  - search: '/- chore\(deps\): update (?:(?:action |dependency |module )?(?:[^\s/]+/)*([^\s/]+))(?: docker tag)? to (\S+) \(/g'
    replace: "- Update $1 to $2 ("
  - search: '/- Update (?:[^\s/]+/)+([^\s/]+) to /g'
    replace: "- Update $1 to "

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
